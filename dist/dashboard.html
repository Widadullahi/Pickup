function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function heading(title,sub,button=true){return `<div class="heading"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${button?'<button class="btn" onclick="newBooking()">＋ &nbsp; Book a delivery</button>':''}</div>`}function render(){document.querySelector('.count').textContent=jobs.length;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').innerHTML='Workspace <span style="color:#b3bab1;margin:0 12px">/</span> '+({overview:'Overview',deliveries:'My deliveries',carriers:'Carriers',wallet:'Payments',addresses:'Saved addresses',ops:'Operations'}[page]);let html='';if(page==='overview'){html=heading('Good morning, Widad ☀','A good day to get things moving.')+`<section class="hero"><div class="heroText"><div class="eyebrow">BIG LOADS. LOCAL HANDS.</div><h2>More than a parcel.<br>More peace of mind.</h2><p>From farm baskets to business supplies. Book a verified carrier and let’s move it, together.</p><button class="btn lime" onclick="newBooking()">Let’s move your goods &nbsp; ↗</button></div><div class="art"><svg viewBox="0 0 480 260"><circle cx="306" cy="121" r="107" stroke="#62846a" stroke-opacity=".2" fill="none"/><circle cx="306" cy="121" r="78" stroke="#62846a" stroke-opacity=".2" fill="none"/><path d="M0 231L480 146" stroke="#759373" stroke-opacity=".3" stroke-width="2" stroke-dasharray="9 12"/><ellipse cx="275" cy="222" rx="149" ry="18" fill="#0c352b"/><g transform="translate(55 23) rotate(-5 220 150)"><path d="M99 121H281L303 161H335V194H99Z" fill="#dce6c8"/><path d="M253 115H290L324 157H253Z" fill="#edf2dd"/><path d="M265 124H285L307 151H265Z" fill="#487365"/><path d="M103 165H331V188H103Z" fill="#a3ba81"/><rect x="107" y="139" width="138" height="17" rx="2" fill="#dce6c8"/><path d="M108 121V157M140 121V157M174 121V157M210 121V157M243 121V157" stroke="#91a476" stroke-width="4"/><rect x="117" y="80" width="48" height="41" rx="3" fill="#b3cc75"/><path d="M120 90H163M120 100H163M120 110H163" stroke="#7b9d4d" stroke-width="2"/><rect x="169" y="69" width="53" height="52" rx="3" fill="#d7bb83"/><path d="M190 69V121" stroke="#b49463" stroke-width="7"/><rect x="224" y="90" width="28" height="31" rx="2" fill="#a5c476"/><circle cx="146" cy="192" r="24" fill="#173b31"/><circle cx="146" cy="192" r="12" fill="#879b82"/><circle cx="288" cy="192" r="24" fill="#173b31"/><circle cx="288" cy="192" r="12" fill="#879b82"/><rect x="319" y="163" width="13" height="7" fill="#f9e7b0"/></g><path d="M397 147V72M397 114Q362 96 374 81Q395 85 397 114M398 99Q424 78 430 91Q427 109 398 117" stroke="#6d9260" stroke-width="5" fill="#6d9260"/></svg></div></section><div class="stats">${[['Active deliveries',jobs.filter(j=>j.status!=='Delivered').length,'↗','<b>2 on the road</b> right now'],['Completed deliveries','24','✓','<b>↑ 6</b> this month'],['Total delivery spend','₦182,500','▤','Across 24 deliveries'],['Your trust score','4.9','☆','From your carriers']].map(s=>`<div class="stat"><div class="stathead">${s[0]}<span>${s[2]}</span></div><strong>${s[1]}</strong><small>${s[3]}</small></div>`).join('')}</div><div class="cols"><section class="panel"><div class="paneltitle"><h3>Your deliveries</h3><button class="textbtn" onclick="go('deliveries')">View all &nbsp; ↗</button></div><div class="tabs">${['Active','Scheduled','Completed'].map(t=>`<button onclick="tab='${t}';render()" class="${tab===t?'selected':''}">${t}${t==='Active'?' ('+jobs.filter(j=>j.status!=='Delivered').length+')':''}</button>`).join('')}</div>${filtered().slice(0,2).map(jobCard).join('')||'<div class="empty">No scheduled deliveries yet.<br><button class="textbtn" onclick="newBooking()">Plan your next delivery →</button></div>'}</section><div><section class="panel"><div class="paneltitle"><h3>A little closer to delivery</h3><span class="badge">In transit</span></div>${map}<div class="trackingfoot"><div class="row"><strong style="font-size:12px">Mile 12 → Bodija</strong><span style="font-size:10px;color:#7f897c">#CF-1024</span></div><div class="progress"><i></i></div><div class="row"><span class="detail">Estimated arrival</span><strong style="font-size:11px">Today, 2:45 PM</strong></div><button class="textbtn" style="padding:14px 0 0" onclick="detail('CF-1024')">Track delivery &nbsp; →</button></div></section><section class="businessnote"><h3>Built around your business</h3><p>From one market run to your next big restock. Keep your deliveries in one place.</p><button class="textbtn" onclick="newBooking()" style="padding:0">Plan your next delivery ↗</button></section></div></div><div class="bottomstrip"><span>♧ &nbsp; Verified carriers. Protected payments. Every step of the way.</span><span>Built for our roads. Built for our communities.</span></div>`}
if(page==='deliveries')html=heading('My deliveries','Every load, from handover to happy arrival.')+`<div class="panel"><div class="tabs" style="padding-top:20px">${['Active','Scheduled','Completed','All'].map(t=>`<button class="${tab===t?'selected':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div>${filtered().map(jobCard).join('')||'<div class="empty">No deliveries in this view.</div>'}</div>`;
if(page==='carriers')html=heading('Good people. Reliable wheels.','Meet the demo carriers on the Lagos–Ibadan corridor.',false)+`<div class="notice">These are sample carrier profiles. Live KYC and verification are not connected.</div><div class="carriergrid">${[['AO','Adebayo Ogunleye','Pickup','1,000 kg','128'],['CE','Chinedu Eze','Van','1,500 kg','86'],['MA','Musa Abdullahi','Light truck','3,000 kg','210']].map(c=>`<div class="panel carrier"><div class="row"><div class="avatar">${c[0]}</div><span class="badge">✓ Demo verified</span></div><h3>${c[1]}</h3><p class="sub">${c[2]} · ${c[3]} capacity</p><p class="sub">★ 4.9 &nbsp; · &nbsp; ${c[4]} deliveries</p><div class="notice" style="margin-top:20px">Lagos ↔ Ibadan<br>Careful handling · Good communication</div><button class="btn light" onclick="newBooking()">Book a delivery →</button></div>`).join('')}</div><section class="businessnote"><h3>Have a vehicle? Put it to work.</h3><p>Register your interest in becoming a carrier on our pilot corridor.</p><button class="btn" onclick="carrierForm()">Join as a carrier ↗</button></section>`;
if(page==='wallet')html=heading('Payments, with peace of mind.','A clear view of your delivery spend and protected funds.',false)+`<div class="notice">Demo ledger only. No money is collected, held or transferred.</div><div class="stats"><div class="stat"><div class="stathead">Held for delivery</div><strong>₦41,100</strong><small>Sample escrow balance</small></div><div class="stat"><div class="stathead">Fuel advance released</div><strong>₦11,400</strong><small>40% on confirmed pickup</small></div><div class="stat"><div class="stathead">Completed spend</div><strong>₦182,500</strong><small>24 deliveries</small></div></div><div class="panel tablewrap"><table><thead><tr><th>Delivery</th><th>Amount</th><th>Status</th><th>Protection</th></tr></thead><tbody>${jobs.map(j=>`<tr><td>${j.id}</td><td>${money(j.price)}</td><td>${j.status}</td><td><span class="badge">${j.status==='Delivered'?'Released':'Demo escrow'}</span></td></tr>`).join('')}</tbody></table></div>`;
if(page==='addresses'){let a=JSON.parse(localStorage.getItem('cf-addresses')||'["Mile 12 Market, Lagos","Bodija Market, Ibadan"]');html=heading('Your familiar places','Save a landmark. Make your next booking quicker.',false)+`<button class="btn" onclick="addAddress()">＋ Add address</button><div class="carriergrid" style="margin-top:22px">${a.map((v,i)=>`<div class="panel carrier"><span style="font-size:24px">⌖</span><h3>${esc(v)}</h3><p class="sub">Saved pickup or drop-off</p><button class="textbtn" style="margin-top:20px" onclick="removeAddress(${i})">Remove</button></div>`).join('')}</div>`}
if(page==='ops')html=heading('Pilot operations','A sample workspace for carrier reviews and delivery exceptions.',false)+`<div class="notice">Demo operations view. No real identity documents or bank details are collected.</div><div class="panel"><div class="paneltitle"><h3>Carrier approval queue</h3><span class="badge">1 pending</span></div><div class="delivery" id="approval"><div class="row"><div><b>Samuel Adeyemi</b><p class="sub">Van · Lagos – Ibadan · Sample application</p></div><button class="btn" onclick="reviewCarrier()">Review application</button></div></div></div><div class="sectiontop">Delivery exceptions</div><div class="panel empty">No open disputes in this demo.<br>Disputed funds remain frozen until an evidence-based review.</div>`;
$('#content').innerHTML=html}function filtered(){return jobs.filter(j=>tab==='All'||(tab==='Completed'?j.status==='Delivered':tab==='Scheduled'?j.status==='Scheduled':!['Delivered','Scheduled'].includes(j.status)))}function go(p){page=p;render();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),4000)}function show(t,b){$('#modalTitle').textContent=t;$('#modalBody').innerHTML=b;$('#modal').showModal()}function newBooking(){booking={};show('Let’s move your goods',`<div class="notice">1 of 2 · Load & route<br>Demo pilot: Lagos ↔ Ibadan. Prices are illustrative.</div><form id="bookform"><div class="fields"><label>Pickup landmark<input name="from" placeholder="e.g. Mile 12 Market, Lagos" required maxlength="100"></label><label>Drop-off landmark<input name="to" placeholder="e.g. Bodija Market, Ibadan" required maxlength="100"></label><label class="wide">What are you moving?<input name="goods" placeholder="e.g. 12 baskets of tomatoes" required maxlength="150"></label><label>Goods category<select name="category"><option>Farm produce</option><option>Grain & dry goods</option><option>Business supplies</option><option>Household goods</option><option>Live animals</option></select></label><label>Estimated weight (kg)<input name="weight" type="number" min="1" max="5000" placeholder="250" required></label><label>Pickup date<input name="date" type="date" required min="${new Date().toISOString().slice(0,10)}"></label><label>Special handling<select name="handling"><option>Standard handling</option><option>Perishable</option><option>Fragile</option><option>Keep upright</option><option>Live animals</option></select></label><label>Receiver name<input name="receiver" required placeholder="Full name"></label><label>Receiver phone<input name="phone" type="tel" pattern="[+0-9 ()-]{10,18}" required placeholder="0801 234 5678"></label></div><label class="check"><input type="checkbox" required><span>I confirm this load contains no weapons, illegal substances, hazardous chemicals or stolen goods. Live animals require approved handling.</span></label><div class="modalfooter"><span class="detail">No payment required in demo</span><button class="btn">Get my quote →</button></div></form>`);$('#bookform').onsubmit=e=>{e.preventDefault();booking=Object.fromEntries(new FormData(e.target));quote()}}
function quote(){let weight=+booking.weight;booking.vehicle=weight<=1000?'Pickup':weight<=1500?'Van':'Light truck';booking.price=18000+Math.ceil(weight/100)*500+3000+1500;$('#modalTitle').textContent='A clear price. No surprises.';$('#modalBody').innerHTML=`<div class="notice">2 of 2 · Review your demo quote<br>${esc(booking.from)} → ${esc(booking.to)}<br>${esc(booking.goods)} · ${booking.weight} kg · ${booking.vehicle}</div>${[['Corridor base fare',18000],['Load surcharge',Math.ceil(weight/100)*500],['Loading & road allowance',3000],['Platform fee',1500]].map(r=>`<div class="quoteRow"><span>${r[0]}</span><b>${money(r[1])}</b></div>`).join('')}<div class="quoteRow" style="font-size:19px"><b>Total</b><b>${money(booking.price)}</b></div><p class="sub" style="line-height:1.8">A verified carrier is matched after payment in the live product. 40% fuel advance at pickup; the balance after delivery confirmation. This demo does not charge you.</p><div class="modalfooter"><button class="textbtn" onclick="newBooking()">Start over</button><button class="btn" onclick="confirmBooking()">Create demo booking →</button></div>`}function confirmBooking(){let j={id:'CF-'+(1025+jobs.length-4),from:booking.from,to:booking.to,goods:booking.goods,vehicle:booking.vehicle,price:booking.price,status:'Matching carrier',name:'Finding your carrier',initial:'…'};jobs.unshift(j);localStorage.setItem('cf-jobs',JSON.stringify(jobs));$('#modal').close();tab='Active';go('deliveries');toast('Demo booking created. No payment was taken.')}
function detail(id){let j=jobs.find(j=>j.id===id);show('Delivery #'+id,`<div class="row" style="margin-bottom:16px"><b>${esc(j.from)} → ${esc(j.to)}</b><span class="badge">${j.status}</span></div>${map}<div class="quoteRow"><span>Load</span><b>${esc(j.goods)}</b></div><div class="quoteRow"><span>Carrier</span><b>${j.name} · ${j.vehicle}</b></div><div class="quoteRow"><span>Delivery total</span><b>${money(j.price)}</b></div><div class="notice" style="margin-top:18px">Demo tracking. Location and estimated arrival are illustrative.<br>Pickup evidence → Fuel advance → Delivery inspection → Balance release</div><button class="btn light" onclick="support()">Get help with this delivery</button> <button class="textbtn" onclick="dispute('${j.id}')">Report an issue</button>`)}function dispute(id){$('#modal').close();show('Report an issue · '+id,`<form id="issue"><label>What happened?<select required><option>Goods damaged</option><option>Missing items</option><option>Delivery delayed</option><option>Other issue</option></select></label><label style="margin-top:15px">Describe the issue<input required placeholder="Tell the operations team what happened"></label><p class="sub">In the live service, evidence is collected and disputed funds are frozen for review.</p><div class="modalfooter"><span class="detail">Demo only</span><button class="btn">Submit demo issue</button></div></form>`);$('#issue').onsubmit=e=>{e.preventDefault();$('#modal').close();toast('Demo issue recorded for review. No funds were moved.')}}function support(){if($('#modal').open)$('#modal').close();show('A little help on the road',`<div class="notice">Pilot support · Demo workspace</div><h3>We’re here for your next move.</h3><p class="sub" style="line-height:1.9">For an active delivery, open its details and choose “Report an issue”. Real-time chat, masked calling and SMS support will be connected before the pilot launches.</p><button class="btn" style="margin-top:20px" onclick="modal.close();go('deliveries')">Find a delivery →</button>`)}function carrierForm(){show('Make your next trip count',`<div class="notice">Demo interest form. Please do not submit identity or bank documents here.</div><form id="carrierform"><div class="fields"><label>Full name<input required></label><label>Phone number<input type="tel" required pattern="[+0-9 ()-]{10,18}"></label><label>Vehicle type<select><option>Korope</option><option>Danfo / minibus</option><option>Pickup</option><option>Van</option><option>Light truck</option><option>Truck</option></select></label><label>Operating route<input value="Lagos – Ibadan" required></label></div><div class="modalfooter"><span class="detail">Verification required before jobs</span><button class="btn">Submit demo interest</button></div></form>`);$('#carrierform').onsubmit=e=>{e.preventDefault();$('#modal').close();toast('Demo interest submitted. Live onboarding is not connected.')}}function addAddress(){show('Save a familiar place',`<form id="addressform"><label>Address & nearby landmark<input name="address" required maxlength="140" placeholder="Market, street, town and landmark"></label><div class="modalfooter"><span></span><button class="btn">Save address</button></div></form>`);$('#addressform').onsubmit=e=>{e.preventDefault();let a=JSON.parse(localStorage.getItem('cf-addresses')||'["Mile 12 Market, Lagos","Bodija Market, Ibadan"]');a.push(new FormData(e.target).get('address'));localStorage.setItem('cf-addresses',JSON.stringify(a));$('#modal').close();render()}}function removeAddress(i){let a=JSON.parse(localStorage.getItem('cf-addresses')||'["Mile 12 Market, Lagos","Bodija Market, Ibadan"]');a.splice(i,1);localStorage.setItem('cf-addresses',JSON.stringify(a));render()}function reviewCarrier(){show('Review sample application',`<div class="notice">Samuel Adeyemi · Van · Lagos – Ibadan<br>All items below are sample review states.</div>${['Identity verification','Driver’s licence','Vehicle photos & papers','Guarantor confirmation'].map(x=>`<div class="quoteRow"><span>${x}</span><span class="badge">Sample complete</span></div>`).join('')}<div class="modalfooter"><button class="btn light" onclick="approval('Resubmission requested')">Request resubmission</button><button class="btn" onclick="approval('Demo approved')">Approve demo carrier</button></div>`)}function approval(s){$('#modal').close();$('#approval').innerHTML='<span class="badge">'+s+'</span>';toast(s+' — no live carrier account was changed.')}render();const openPage=sessionStorage.getItem('cf-open-page');if(openPage){sessionStorage.removeItem('cf-open-page');go(openPage)}
if(new URLSearchParams(location.search).get('book')==='1'){newBooking();try{const saved=JSON.parse(sessionStorage.getItem('cf-route')||'null');if(saved){document.querySelector('[name="from"]').value=saved.from;document.querySelector('[name="to"]').value=saved.to;sessionStorage.removeItem('cf-route')}}catch(e){}}
</script></body></html>
